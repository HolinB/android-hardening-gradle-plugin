name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Verify wrapper JAR checksum
        run: ./scripts/verify-gradle-wrapper.sh
      - name: Verify source and binary TestKit contracts
        run: ./gradlew --no-daemon checkHardeningEnvironment check verifyPortableHardeningPlugin
      - name: Build first portable publication
        run: |
          ./gradlew --no-daemon --rerun-tasks packagePortableHardeningPlugin verifyPortableHardeningPlugin
          cp build/distributions/hardening-gradle-plugin-1.3.0-portable-maven.zip "$RUNNER_TEMP/portable-first.zip"
      - name: Rebuild and compare portable publication
        run: |
          ./gradlew --no-daemon --rerun-tasks packagePortableHardeningPlugin verifyPortableHardeningPlugin
          cmp --silent "$RUNNER_TEMP/portable-first.zip" build/distributions/hardening-gradle-plugin-1.3.0-portable-maven.zip
